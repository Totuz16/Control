<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3EF">
<link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Finanzas</title>
<style>
:root{--bg:#F1F3EF;--card:#fff;--ink:#16202B;--mute:#6B7682;--line:#DDE2DC;--pos:#0E7A5F;--neg:#B4322A;--acc:#1F4FD8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#12171C;--card:#1B222A;--ink:#E9EDF0;--mute:#93A0AC;--line:#2B343D;--pos:#4CC9A0;--neg:#FF8A80;--acc:#7C9BFF}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior:none}
main{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;margin:4px 0 14px;letter-spacing:-.02em}
h2{font-size:15px;margin:22px 0 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row small{color:var(--mute);display:block;font-size:13px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--acc);margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 13px system-ui;padding:10px 0}
nav button.on{color:var(--acc)}
nav .plus{flex:0 0 60px;height:60px;border-radius:30px;background:var(--acc);color:#fff;font-size:34px;font-weight:300;margin-top:-26px}
input,select,button.btn{width:100%;font:17px system-ui;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
button.btn{background:var(--acc);color:#fff;border:0;font-weight:600}
button.btn.sec{background:var(--card);color:var(--acc);border:1px solid var(--line)}
button.btn.del{background:var(--card);color:var(--neg);border:1px solid var(--line)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
#sheet>div{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.msg{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center}.top button{background:none;border:0;color:var(--acc);font:600 17px system-ui;padding:8px}
</style></head><body>
<main id="v"></main>
<nav><button data-t="inicio">Inicio</button><button data-t="movs">Movimientos</button><button class="plus" id="add" aria-label="Registrar">+</button><button data-t="mas">Más</button></nav>
<div id="sheet"><div id="sb"></div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const money=(n,c='COP')=>c==='COP'?fmt.format(n):n.toLocaleString('es-CO',{maximumFractionDigits:c==='BTC'?8:2})+' '+c;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let db,M=[],C={cuentas:[],signos:{},categorias:{},subcategorias:{}},CM={},X={},tab='inicio',mes=today().slice(0,7),q='';
const GASTO=new Set(['GASTO','COMPRA','FINANCIERO']); // igual que la hoja MES del Excel

const openDB=()=>new Promise((ok,ko)=>{const r=indexedDB.open('finanzas',1);r.onupgradeneeded=()=>{r.result.createObjectStore('mov',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const done=t=>new Promise((ok,ko)=>{t.oncomplete=ok;t.onerror=t.onabort=()=>ko(t.error)});
const getAll=s=>new Promise((ok,ko)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
async function put(s,rows){const t=db.transaction(s,'readwrite');rows.forEach(r=>t.objectStore(s).put(r));await done(t)}
async function load(){M=await getAll('mov');X={};for(const m of await getAll('meta'))if(m.k==='cfg')C=m.v;else X[m.k]=m.v;CM=Object.fromEntries(C.cuentas.map(c=>[c.medio,c]))}
const val=m=>m.monto*(C.signos[(CM[m.medio]||{}).clase+'|'+m.concepto]||0);
const setX=(k,v)=>{X[k]=v;return put('meta',[{k,v}])};

// ---------- Vistas ----------
function saldos(){const s={};for(const m of M)s[m.medio]=(s[m.medio]||0)+val(m);return s}
function inicio(){
  if(!M.length)return `<h1>Finanzas</h1><div class="msg">La base está vacía. Ve a <b>Más → Importar datos</b> y elige el archivo <b>datos-iniciales.json</b> (o una copia de seguridad).</div>`;
  const S=saldos(),cop=c=>Object.entries(S).filter(([k])=>CM[k]&&CM[k].moneda==='COP'&&CM[k].clase===c);
  const A=cop('ACTIVO').reduce((a,[,v])=>a+v,0),P=cop('PASIVO').reduce((a,[,v])=>a+v,0);
  const dm=M.filter(m=>m.moneda==='COP'&&(m.fecha||'').startsWith(mes));
  const ing=dm.filter(m=>m.concepto==='INGRESO').reduce((a,m)=>a+m.monto,0);
  const gs=dm.filter(m=>GASTO.has(m.concepto));const gas=gs.reduce((a,m)=>a+m.monto,0);
  const cat={};gs.forEach(m=>{const k=m.categoria||'(sin categoría)';cat[k]=(cat[k]||0)+m.monto});
  const top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=top[0]?top[0][1]:1;
  const rows=c=>Object.entries(S).filter(([k,v])=>CM[k]&&CM[k].clase===c&&Math.abs(v)>=1).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${money(v,CM[k].moneda)}</b></div>`).join('');
  const dias=X.copia?Math.floor((Date.now()-X.copia)/864e5):null;
  const [y,mo]=mes.split('-');const nom=new Date(y,mo-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  return `<h1>Finanzas</h1>
  ${dias===null||dias>14?`<div class="msg neg">${dias===null?'Aún no has exportado ninguna copia de seguridad.':`Última copia hace ${dias} días.`} Hazla en <b>Más</b>.</div>`:''}
  <div class="top"><button data-m="-1">‹</button><b style="text-transform:capitalize">${nom}</b><button data-m="1">›</button></div>
  <div class="card" style="margin-top:8px"><div class="row"><span>Gastos<small>gasto + compras + financiero</small></span><b class="neg">${money(gas)}</b></div>
  <div class="row"><span>Ingresos</span><b class="pos">${money(ing)}</b></div>
  <div class="row"><span>Balance del mes</span><b class="${ing-gas<0?'neg':'pos'}">${money(ing-gas)}</b></div></div>
  <h2>En qué gastaste</h2><div class="card">${top.map(([k,v])=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar" style="width:${Math.max(3,v/mx*100)}%"></div></div>`).join('')||'<div class="row mute">Sin gastos en este mes</div>'}</div>
  <h2>Patrimonio en pesos</h2><div class="card"><div class="row"><span>Activos</span><b>${money(A)}</b></div><div class="row"><span>Deudas</span><b>${money(P)}</b></div><div class="row"><span>Neto<small>sin bienes materiales ni USD/BTC</small></span><b class="${A-P<0?'neg':'pos'}">${money(A-P)}</b></div></div>
  <h2>Saldo por cuenta</h2><div class="card">${rows('ACTIVO')}</div>
  <h2>Lo que debes</h2><div class="card">${rows('PASIVO')}</div>`;
}
function movs(){
  const t=q.toLowerCase();
  const L=M.filter(m=>!t||[m.medio,m.concepto,m.categoria,m.subcategoria,m.establecimiento,m.observacion].some(x=>x&&String(x).toLowerCase().includes(t)))
    .sort((a,b)=>(b.fecha||'0').localeCompare(a.fecha||'0')||b.id-a.id);
  return `<h1>Movimientos</h1><input id="q" type="search" placeholder="Buscar: Netflix, Farmatodo, COMIDA…" value="${esc(q)}">
  <div class="mute" style="margin:0 2px 8px;font-size:14px">${L.length.toLocaleString('es-CO')} resultados${L.length>200?' · mostrando 200':''}</div>
  <div class="card">${L.slice(0,200).map(m=>{const v=val(m);return `<div class="row" data-id="${m.id}"><span>${esc(m.categoria||m.concepto)}${m.subcategoria?' · '+esc(m.subcategoria):''}<small>${m.fecha||'Saldo inicial'} · ${esc(m.medio)}${m.establecimiento?' · '+esc(m.establecimiento):''}${m.observacion?' · '+esc(m.observacion):''}</small></span><b class="${v<0?'neg':'pos'}">${money(m.monto,m.moneda)}</b></div>`}).join('')||'<div class="row mute">Nada encontrado</div>'}</div>`;
}
function mas(){
  const c=X.copia?new Date(X.copia).toLocaleString('es-CO'):'nunca';
  return `<h1>Más</h1><div class="msg">${M.length.toLocaleString('es-CO')} movimientos guardados en este iPhone.<br>Última copia de seguridad: ${c}.<br><span id="per"></span></div>
  <button class="btn" id="exp">Exportar copia de seguridad</button>
  <button class="btn sec" id="imp">Importar datos / Restaurar copia</button>
  <button class="btn sec" id="csv">Exportar movimientos a CSV</button>
  <div class="msg" style="margin-top:14px">Restaurar reemplaza todo lo que hay en la app por el contenido del archivo. Guarda la copia en Archivos (iCloud Drive) o envíatela por correo: si borras Safari o cambias de iPhone, ese archivo es tu respaldo.</div>`;
}
function render(){
  document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const v=$('#v');v.innerHTML={inicio,movs,mas}[tab]();
  if(tab==='movs'){const i=$('#q');i.oninput=()=>{q=i.value;const p=i.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
  if(tab==='mas'){if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{const e=$('#per');if(e)e.textContent=p?'Almacenamiento protegido por el sistema.':'Almacenamiento sin protección extra: haz copias con frecuencia.'})}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
  const m=e.target.closest('[data-m]');if(m){const d=new Date(mes+'-01T12:00');d.setMonth(d.getMonth()+ +m.dataset.m);mes=d.toISOString().slice(0,7);render();return}
  const r=e.target.closest('[data-id]');if(r&&tab==='movs')detalle(+r.dataset.id);
});
document.querySelectorAll('nav [data-t]').forEach(b=>b.onclick=null);

// ---------- Hoja modal ----------
const sheet=h=>{$('#sb').innerHTML=h;$('#sheet').classList.add('on')};
const close=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')close()};
function detalle(id){
  const m=M.find(x=>x.id===id);if(!m)return;
  sheet(`<h1>${money(m.monto,m.moneda)}</h1><div class="msg">${esc(m.concepto)} · ${esc(m.medio)}<br>${m.fecha||'Saldo inicial'}<br>${esc([m.categoria,m.subcategoria,m.establecimiento,m.observacion].filter(Boolean).join(' · '))}</div>
  <button class="btn del" id="del">Eliminar movimiento</button><button class="btn sec" onclick="close()">Cerrar</button>`);
  $('#del').onclick=async()=>{if(!confirm('¿Eliminar este movimiento? Si es parte de una transferencia, elimina también la otra fila.'))return;
    const t=db.transaction('mov','readwrite');t.objectStore('mov').delete(id);await done(t);await load();close();render()};
}

// ---------- Registro rápido ----------
let R={tipo:'gasto'};
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const cuentas=cl=>C.cuentas.filter(c=>c.moneda==='COP'&&(!cl||c.clase===cl)).map(c=>c.medio);
function form(){
  const u=X.ult||{},t=R.tipo;
  let h=`<div class="top"><h1 style="margin:0">Registrar</h1><button onclick="close()">Cancelar</button></div><div class="seg" style="margin-top:12px">${['gasto','ingreso','transferencia'].map(k=>`<button data-k="${k}" class="${t===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
  <input id="f-monto" inputmode="decimal" placeholder="Valor" autocomplete="off">`;
  if(t==='transferencia')h+=`<select id="f-de">${opts(cuentas('ACTIVO'),u.de)}</select><select id="f-a">${opts(cuentas('ACTIVO'),u.a)}</select>`;
  else{
    const cta=t==='gasto'?cuentas():cuentas('ACTIVO'),cta0=cta.includes(u[t])?u[t]:cta[0];
    R.cta=R.cta&&cta.includes(R.cta)?R.cta:cta0;
    const pas=(CM[R.cta]||{}).clase==='PASIVO';
    const lc=t==='ingreso'?C.categorias['CATEGORÍA_INGRESO']:C.categorias[pas?'CATEGORÍA_COMPRA':'CATEGORÍA_GASTO'];
    R.cat=lc.includes(R.cat)?R.cat:(lc.includes(u.cat)?u.cat:lc[0]);
    h+=`<select id="f-cta">${opts(cta,R.cta)}</select><select id="f-cat">${opts(lc,R.cat)}</select>
    <select id="f-sub"><option value="">Sin subcategoría</option>${opts(C.subcategorias[R.cat]||[],'')}</select>
    <input id="f-est" placeholder="Establecimiento (opcional)">`;
  }
  h+=`<input id="f-fecha" type="date" value="${today()}"><input id="f-obs" placeholder="Descripción (opcional)"><button class="btn" id="f-ok">Guardar</button>`;
  sheet(h);
  document.querySelectorAll('.seg [data-k]').forEach(b=>b.onclick=()=>{R={tipo:b.dataset.k,m:$('#f-monto').value};form()});
  if($('#f-cta'))$('#f-cta').onchange=e=>{R.m=$('#f-monto').value;R.cta=e.target.value;R.cat=null;form()};
  if($('#f-cat'))$('#f-cat').onchange=e=>{R.m=$('#f-monto').value;R.cat=e.target.value;form()};
  $('#f-ok').onclick=guardar;if(R.m)$('#f-monto').value=R.m;else $('#f-monto').focus();
}
async function guardar(){
  const monto=parseFloat($('#f-monto').value.replace(/\./g,'').replace(',','.')||$('#f-monto').value);
  if(!(monto>0)){alert('Escribe un valor mayor que cero.');return}
  const base={fecha:$('#f-fecha').value,monto,moneda:'COP',observacion:$('#f-obs').value.trim()||null},t=R.tipo,u=X.ult||{};let rows;
  if(t==='transferencia'){const de=$('#f-de').value,a=$('#f-a').value;if(de===a){alert('Elige dos cuentas distintas.');return}
    rows=[{...base,medio:de,concepto:'TRANS.SALIDA'},{...base,medio:a,concepto:'TRANS.ENTRADA'}];u.de=de;u.a=a}
  else{const cta=$('#f-cta').value,pas=CM[cta].clase==='PASIVO';
    rows=[{...base,medio:cta,concepto:t==='ingreso'?'INGRESO':pas?'COMPRA':'GASTO',categoria:$('#f-cat').value,subcategoria:$('#f-sub').value||null,establecimiento:$('#f-est').value.trim()||null}];u[t]=cta;u.cat=$('#f-cat').value}
  await put('mov',rows);await setX('ult',u);await load();close();render();
}
$('#add').onclick=()=>{if(!C.cuentas.length){alert('Primero importa tus datos en Más → Importar datos.');return}R={tipo:'gasto'};form()};

// ---------- Copias de seguridad ----------
async function exportar(){
  const data=JSON.stringify({app:'finanzas-pwa',version:1,exportadoEn:new Date().toISOString(),...C,ultimos:X.ult||{},movimientos:M.map(({id,...r})=>r)});
  const nombre=`finanzas-copia-${today()}.json`,f=new File([data],nombre,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:nombre});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=nombre;a.click()}}
  catch(e){if(e.name==='AbortError')return;alert('No se pudo exportar: '+e.message);return}
  await setX('copia',Date.now());render();
}
async function restaurar(file){
  let d;try{d=JSON.parse(await file.text())}catch{alert('El archivo no es un JSON válido.');return}
  if(d.app!=='finanzas-pwa'||!Array.isArray(d.movimientos)||!d.cuentas||!d.signos){alert('Este archivo no es una copia de esta app.');return}
  if(M.length&&!confirm(`Esto reemplaza los ${M.length} movimientos actuales por ${d.movimientos.length} del archivo. ¿Continuar?`))return;
  const t=db.transaction(['mov','meta'],'readwrite');t.objectStore('mov').clear();
  d.movimientos.forEach(m=>t.objectStore('mov').add(m));
  t.objectStore('meta').put({k:'cfg',v:{cuentas:d.cuentas,signos:d.signos,categorias:d.categorias,subcategorias:d.subcategorias}});
  if(d.ultimos)t.objectStore('meta').put({k:'ult',v:d.ultimos});
  await done(t);await load();render();alert(`Listo: ${M.length} movimientos cargados.`);
}
function csv(){
  const h=['fecha','cuenta','concepto','monto','moneda','categoria','subcategoria','establecimiento','observacion'];
  const l=[h.join(',')].concat(M.map(m=>[m.fecha,m.medio,m.concepto,m.monto,m.moneda,m.categoria,m.subcategoria,m.establecimiento,m.observacion].map(x=>x==null?'':'"'+String(x).replace(/"/g,'""')+'"').join(',')));
  const f=new File(['\ufeff'+l.join('\n')],`finanzas-movimientos-${today()}.csv`,{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
}
document.addEventListener('click',e=>{const i=e.target.id;
  if(i==='exp')exportar();else if(i==='imp')$('#file').click();else if(i==='csv')csv()});
$('#file').onchange=e=>{if(e.target.files[0])restaurar(e.target.files[0]);e.target.value=''};

(async()=>{
  db=await openDB();await load();render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
})();
</script>
<script src="mod2.js"></script>
<body></body></html>
